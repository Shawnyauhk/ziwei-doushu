name: 正式站問題 / metisziwei.com issue
description: 線上網站（metisziwei.com）登入、支付、顯示等問題
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: 出問題的頁面地址
      placeholder: https://metisziwei.com/……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎麼出現的
      placeholder: 點了什麼、填了什麼、看到什麼報錯
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 瀏覽器與系統
      placeholder: 例：Windows 11 / Chrome 153 / 公司網路開了代理
  - type: textarea
    id: screenshot
    attributes:
      label: 截圖
      description: 請勿貼出手機號、驗證碼、他人的生辰等隱私資訊。
