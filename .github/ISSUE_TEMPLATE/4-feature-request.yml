name: 功能建議 / Feature request
description: 想要的新功能或改進
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 想解決什麼問題
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你設想的做法
  - type: textarea
    id: source
    attributes:
      label: 依據（涉及命理口徑時請寫）
      description: 出自哪本書、哪一講，或哪個排盤軟體的哪種設定。沒有出處的口徑改動我們一般不收。
