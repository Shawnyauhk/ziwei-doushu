name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 型別檢查 + 排盤迴歸
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 倉庫已提交 package-lock.json：按鎖定版本安裝，並開 npm 快取
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安裝依賴
        run: npm ci --no-audit --no-fund

      - name: 型別檢查
        run: npm run typecheck

      - name: 排盤引擎迴歸
        run: npm test
